[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boabot"
version = "0.1.0"
description = "Grounded Albanian banking-regulation and tariff assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.24,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "sentence-transformers>=3,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
voice = [
  "azure-cognitiveservices-speech>=1.40",
  "google-cloud-speech>=2.29",
  "google-genai>=1.0",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "redis>=5",
  "websockets>=13",
]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "voice/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
include = ["core*", "voice*"]
